# ==============================================================================
# Society Management System - Application Configuration
# ==============================================================================

server.port=${PORT:8080}
spring.application.name=society-management-system

# ------------------------------------------------------------------------------
# Active Database Configuration: H2 (File-based, persistent)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/societydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# OPTIONAL: Switch to MySQL Database
# To use MySQL, comment out the H2 settings above and uncomment the lines below:
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/society_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# ------------------------------------------------------------------------------
# Thymeleaf Template Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Spring Security / Session Configuration
# ------------------------------------------------------------------------------
spring.session.timeout=30m

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging.level.com.society.management=INFO
logging.level.org.springframework.security=WARN
