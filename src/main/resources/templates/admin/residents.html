<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Resident Management')}"></head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar('residents')}"></div>

        <!-- Main Content Area -->
        <div class="col-md-9 col-lg-10 p-0">
            <!-- Navbar -->
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Resident Accounts & Directory</h3>
                        <p class="text-muted small mb-0">Register society residents, allocate flats, and manage secure portal login accounts.</p>
                    </div>
                </div>

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="row g-4">
                    <!-- Left: Resident Registration Form -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm">
                            <div class="card-header bg-success text-white fw-semibold">
                                <i class="bi bi-person-plus-fill me-1"></i>
                                <span th:text="${isEdit == true ? 'Edit Resident Profile' : 'Register New Resident'}">Register Resident</span>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/admin/residents/save}" th:object="${residentDto}" method="post">
                                    <input type="hidden" th:field="*{id}" />

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. John Doe" required />
                                        <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">Email (Portal Username) <span class="text-danger">*</span></label>
                                        <input type="email" th:field="*{email}" class="form-control" placeholder="user@society.com" required />
                                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">
                                            Password <span th:if="${isEdit != true}" class="text-danger">*</span>
                                            <span th:if="${isEdit == true}" class="text-muted fw-normal">(Leave blank to keep current)</span>
                                        </label>
                                        <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" th:required="${isEdit != true}" />
                                        <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">Phone Number (10 Digits) <span class="text-danger">*</span></label>
                                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required />
                                        <small class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">Assign Flat <span class="text-danger">*</span></label>
                                        <select th:field="*{flatId}" class="form-select" required>
                                            <option value="">-- Choose Flat --</option>
                                            <option th:each="flat : ${flats}" th:value="${flat.id}" th:text="${flat.fullFlatName}">A-101</option>
                                        </select>
                                        <small class="text-danger" th:if="${#fields.hasErrors('flatId')}" th:errors="*{flatId}"></small>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold">Resident Type <span class="text-danger">*</span></label>
                                        <select th:field="*{residentType}" class="form-select" required>
                                            <option value="">-- Select Type --</option>
                                            <option value="OWNER">Owner</option>
                                            <option value="TENANT">Tenant</option>
                                        </select>
                                        <small class="text-danger" th:if="${#fields.hasErrors('residentType')}" th:errors="*{residentType}"></small>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success flex-grow-1">
                                            <i class="bi bi-check-lg me-1"></i>
                                            <span th:text="${isEdit == true ? 'Update Resident' : 'Create Resident Account'}">Create Resident</span>
                                        </button>
                                        <a th:if="${isEdit == true}" th:href="@{/admin/residents}" class="btn btn-outline-secondary">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Residents List Table -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span class="fw-bold"><i class="bi bi-people-fill me-2"></i>Resident Directory (<span th:text="${#lists.size(residents)}">0</span>)</span>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th>Resident Name</th>
                                                <th>Flat</th>
                                                <th>Type</th>
                                                <th>Contact</th>
                                                <th class="text-end">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="res : ${residents}">
                                                <td>
                                                    <div class="fw-semibold text-dark" th:text="${res.user.name}">John Doe</div>
                                                    <small class="text-muted"><i class="bi bi-envelope me-1"></i><span th:text="${res.user.email}">user@society.com</span></small>
                                                </td>
                                                <td>
                                                    <span class="badge bg-primary fs-7" th:text="${res.flat.shortName}">A-101</span>
                                                </td>
                                                <td>
                                                    <span class="badge" th:classappend="${res.residentType == 'OWNER' ? 'bg-info-subtle text-info border' : 'bg-warning-subtle text-warning-emphasis border'}"
                                                          th:text="${res.residentType}">OWNER</span>
                                                </td>
                                                <td>
                                                    <small><i class="bi bi-telephone me-1"></i><span th:text="${res.phone}">9876543210</span></small>
                                                </td>
                                                <td class="text-end">
                                                    <a th:href="@{'/admin/residents/edit/' + ${res.id}}" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                                        <i class="bi bi-pencil-fill"></i>
                                                    </a>
                                                    <form th:action="@{'/admin/residents/delete/' + ${res.id}}" method="post" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-outline-danger btn-delete-confirm" title="Delete">
                                                            <i class="bi bi-trash-fill"></i>
                                                        </button>
                                                    </form>
                                                </td>
                                            </tr>
                                            <tr th:if="${#lists.isEmpty(residents)}">
                                                <td colspan="5" class="text-center text-muted py-4">No residents registered yet.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
