<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Notice Board Management')}"></head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar('notices')}"></div>

        <!-- Main Content Area -->
        <div class="col-md-9 col-lg-10 p-0">
            <!-- Navbar -->
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Notice Board Management</h3>
                        <p class="text-muted small mb-0">Publish official society notices, announcements, and maintenance alerts for residents.</p>
                    </div>
                </div>

                <!-- Flash Alerts -->
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="row g-4">
                    <!-- Left: Notice Form (Publish / Edit) -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white fw-semibold">
                                <i class="bi bi-megaphone-fill me-1"></i>
                                <span th:text="${isEdit == true ? 'Edit Society Notice' : 'Publish New Notice'}">Publish Notice</span>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/admin/notices/save}" th:object="${noticeDto}" method="post">
                                    <input type="hidden" th:field="*{id}" />

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold">Notice Title <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Annual General Meeting (AGM)" required />
                                        <small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold">Notice Content / Details <span class="text-danger">*</span></label>
                                        <textarea th:field="*{message}" class="form-control" rows="6" placeholder="Provide complete notice information, timings, guidelines, etc." required></textarea>
                                        <small class="text-danger" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></small>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary flex-grow-1">
                                            <i class="bi bi-send-fill me-1"></i>
                                            <span th:text="${isEdit == true ? 'Update Notice' : 'Publish Notice to Board'}">Publish Notice</span>
                                        </button>
                                        <a th:if="${isEdit == true}" th:href="@{/admin/notices}" class="btn btn-outline-secondary">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Notice List -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span class="fw-bold"><i class="bi bi-card-list me-2"></i>Published Notices (<span th:text="${#lists.size(notices)}">0</span>)</span>
                            </div>
                            <div class="card-body p-0">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item p-4" th:each="n : ${notices}">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h5 class="fw-bold text-dark mb-0" th:text="${n.title}">Notice Title</h5>
                                            <div class="d-flex align-items-center gap-2">
                                                <small class="badge bg-light text-muted border" th:text="${#temporals.format(n.createdOn, 'dd MMM yyyy, hh:mm a')}">Date</small>
                                                <a th:href="@{'/admin/notices/edit/' + ${n.id}}" class="btn btn-sm btn-outline-primary py-0 px-2" title="Edit">
                                                    <i class="bi bi-pencil-fill"></i>
                                                </a>
                                                <form th:action="@{'/admin/notices/delete/' + ${n.id}}" method="post" class="d-inline">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-delete-confirm py-0 px-2" title="Delete">
                                                        <i class="bi bi-trash-fill"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                        <p class="text-secondary mb-2" style="white-space: pre-line;" th:text="${n.message}">Notice body content...</p>
                                        <small class="text-muted fst-italic">Posted by: <span th:text="${n.postedBy}">Admin</span></small>
                                    </li>
                                    <li class="list-group-item p-4 text-center text-muted" th:if="${#lists.isEmpty(notices)}">
                                        No notices currently on the board.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
