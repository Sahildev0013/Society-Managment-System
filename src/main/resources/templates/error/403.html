<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .error-card {
            background: white;
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 550px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="text-danger mb-3">
        <i class="bi bi-shield-slash fs-1 text-danger" style="font-size: 4rem !important;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark">403</h1>
    <h3 class="fw-semibold text-secondary mb-3">Access Denied</h3>
    <p class="text-muted mb-4">
        You do not have authorization to access this page. Each portal section is strictly restricted to its designated role.
    </p>

    <div class="alert alert-secondary py-2 small mb-4" sec:authorize="isAuthenticated()">
        Currently logged in as: <strong sec:authentication="name">User</strong>
        (<span sec:authentication="principal.authorities">Role</span>)
    </div>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-speedometer2 me-1"></i> Return to My Dashboard
        </a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger px-3 py-2">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>

</body>
</html>
